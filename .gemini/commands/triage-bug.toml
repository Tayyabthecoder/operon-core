description = "Triage a bug report without fixing it: restate the problem, find a minimal reproduction, rate severity and impact, locate the likely cause with the read-only diagnostic-debugger, and write an actionable bug report. Use build-fix or feature-dev afterwards to change code. Arguments: <bug description, issue number, or error message>"
prompt = '''
# Triage a Bug

> **Framework gate**: Triage produces a report, not a code change. Do not edit source files, apply fixes, or run commands that change data. If a fix is wanted, finish this workflow first and then hand the report to the user for `/build-fix` or `/feature-dev`. Opening an issue or posting anywhere outside the repository needs the user's explicit instruction. Redact secrets in any logs you quote as `[REDACTED_SECRET: TYPE]`.

**Input**: `{{args}}` — a description, an error, or an issue number (read it with `gh issue view <n>` only if `gh` is available).

Use the `debugging` skill. The read-only `diagnostic-debugger` analyzes evidence; you (the Primary Agent) run every command and pass sanitized output to it.

---

## Phase 1 — RESTATE

Write the problem in one paragraph: what was expected, what happened instead, where, and for whom. List what is missing. Ask only the questions whose answers change the next step, such as the exact error text, the version or commit, the steps taken, and whether it always happens.

## Phase 2 — REPRODUCE

Find the smallest way to see the failure:
1. Look for an existing failing test or a documented command.
2. Run the narrowest relevant test or command, synchronously, and record the exact output and exit code.
3. If it cannot be reproduced, record what was tried and the environment differences that could matter.

Never mark a bug `Reproduced` without observed output. Use `Not reproduced` or `Cannot reproduce here` honestly.

## Phase 3 — CLASSIFY

| Severity | Meaning |
|---|---|
| Critical | Data loss, security exposure, or total outage |
| High | Core feature broken, no workaround |
| Medium | Feature impaired, workaround exists |
| Low | Cosmetic or rare |

Also record: affected area, regression or long-standing (check `git log` for the last change to the area), and who is affected.

## Phase 4 — LOCATE

Send `diagnostic-debugger` the reproduction output, the relevant file paths, and the question "which code paths could cause this, ranked, and what one check would confirm each?" Run the checks it asks for and return the results. Trace the failure to a file and line where evidence supports it; otherwise say `Likely area` and why.

For a regression, find the introducing commit with read-only history commands (`git log -- <path>`, `git blame <path>`). Do not run `git bisect` or checkout other commits without the user's agreement, since that changes the working tree.

## Phase 5 — REPORT

Write `docs/maintenance/bugs/<YYYY-MM-DD>-<slug>.md` (create the folder if needed), or give the user the text if they prefer an issue:

```markdown
# Bug: <title>

**Severity**: <level>   **Status**: Reproduced | Not reproduced | Cannot reproduce here
**Area**: <module or file>   **Regression**: Yes (<commit>) | No | Unknown

## Summary
## Steps to Reproduce
## Expected / Actual
## Evidence
<sanitized output, exit codes>

## Likely Cause
<confirmed cause with file and line, or "Likely area" and the evidence>

## Suggested Fix Direction
<what to change, not the change itself>

## Tests to Add
<regression test that fails now and should pass after the fix>

## Open Questions
```

Creating a GitHub issue is outward-facing; only do it if the user asks, and show the text first.

## Output

```
Bug: <title>   Severity: <level>   Status: <status>
Likely cause: <file:line | area | unknown>
Regression test: <proposed test>
Report: docs/maintenance/bugs/<file>
Next step: <e.g. /build-fix, or more information needed>
```

---

## Edge Cases

- **Several symptoms**: Split into separate reports.
- **Flaky**: Run the narrow reproduction a few times and report the ratio; do not rerun until it passes.
- **Security-sensitive**: Do not publish details; tell the user and follow `security.md` section 19.
'''
