prompt = '''
# Incident Response

> **Framework gate**: Diagnosis is read-only. Rolling back, restarting services, restoring backups, changing production configuration, or running anything that touches live data requires the user's explicit instruction for that specific step (`deployment.md` sections 8 and 12). Never paste secrets into notes; write `[REDACTED_SECRET: TYPE]`.

**Input**: `{{args}}` — what is failing, when it started, and who or what is affected, if known.

Use the `incident-response` skill. Delegate root-cause analysis to the read-only `diagnostic-debugger`; you (the Primary Agent) run every command and pass sanitized output to it.

---

## Phase 1 — ASSESS

Ask only for what is missing and cannot be found in the repository or logs supplied by the user.

| Question | Why |
|---|---|
| What is the user-visible impact? | Sets severity |
| When did it start, and what changed just before (deploy, config, dependency, traffic)? | Narrows the cause |
| Is data being lost or corrupted? | Decides whether to stop writes first |
| Is there a known good version or rollback target? | Defines containment |

Assign severity:

| Level | Meaning |
|---|---|
| SEV1 | Outage, data loss, or security exposure |
| SEV2 | Major feature broken, no safe workaround |
| SEV3 | Degraded or partial, workaround exists |
| SEV4 | Minor, cosmetic, or single user |

For any suspected secret exposure or intrusion, stop and tell the user to rotate credentials first (`security.md` section 19); then continue.

## Phase 2 — GATHER EVIDENCE (read-only)

```bash
git log --oneline -n 20
git diff HEAD~1 --stat
git status --short
```

Read the relevant logs, error output, and recent changes the user supplied. Record a short timeline: time, event, source. Do not speculate; mark unknowns `UNKNOWN`.

## Phase 3 — CONTAIN (proposal only)

List containment options with their blast radius and reversibility, for example roll back the last deploy, disable a feature flag, scale down a worker, or block a route. Recommend one. **Wait for the user to choose and instruct the action.** If the user asks you to run it, confirm the target environment and the exact command first.

## Phase 4 — FIND THE ROOT CAUSE

Send `diagnostic-debugger` a structured message with the timeline, sanitized evidence, and the question "what are the candidate causes, ranked, and what single check would confirm or rule out each?" Run the checks it requests, one at a time, and report the results back. Stop at the first cause that is confirmed by evidence, not by plausibility.

## Phase 5 — RECOVER AND VERIFY

After the user-approved fix or rollback:
- Run the project's verification (`node .agents/scripts/verify-runner.mjs --profile <profile>` or the project's own test command).
- Confirm the original symptom is gone and no new errors appear.
- State what was verified and what could not be checked.

## Phase 6 — POSTMORTEM

Write `docs/maintenance/incidents/<YYYY-MM-DD>-<slug>.md` (create the folder if needed):

```markdown
# Incident: <title>

**Date**: <date>  **Severity**: <SEV>  **Status**: Resolved | Mitigated | Open

## Impact
<who and what was affected, for how long>

## Timeline
| Time | Event | Source |
|---|---|---|

## Root Cause
<confirmed cause, with evidence; or "Not confirmed" and the leading hypothesis>

## What Went Well / What Did Not
<blameless; focus on systems and process>

## Action Items
| Action | Owner | Priority |
|---|---|---|
```

Keep it blameless: describe system and process gaps, not people.

## Output

```
Incident: <title>   Severity: <SEV>   Status: <status>
Root cause: <confirmed | not confirmed>
Containment: <what the user approved and ran>
Verification: <what passed, what was not checked>
Postmortem: docs/maintenance/incidents/<file>
Follow-ups: <action items>
```

---

## Edge Cases

- **Cannot reproduce**: Say so. Report what was tried and what evidence would help.
- **Production access needed**: You have no access. Ask the user to run the command and paste sanitized output.
- **Several causes**: Fix and verify one at a time so each effect is attributable.
'''
